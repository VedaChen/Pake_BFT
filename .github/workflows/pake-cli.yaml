name: Build App With Pake CLI

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.2"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        required: true
        default: "macos-latest"
        type: choice
        options:
          - "windows-latest"
          - "macos-latest"
          - "ubuntu-24.04"
      url:
        description: "Website URL"
        required: true
      name:
        description: "App name (lowercase for Linux)"
        required: true
      icon:
        description: "Icon URL, auto-fetch if empty"
        required: false
      width:
        description: "Window width (px)"
        required: false
        default: "1200"
      height:
        description: "Window height (px)"
        required: false
        default: "780"
      min_width:
        description: "Minimum window width (px)"
        required: false
      min_height:
        description: "Minimum window height (px)"
        required: false
      app_version:
        description: "App version"
        required: false
        default: "1.0.0"
      fullscreen:
        description: "Start in fullscreen mode"
        required: false
        type: boolean
        default: false
      maximize:
        description: "Start maximized (keeps the native title bar and its buttons)"
        required: false
        type: boolean
        default: false
      window_mode:
        description: "Window mode: window (native buttons), fullscreen (no buttons), frameless (no title bar)"
        required: false
        type: choice
        options:
          - window
          - fullscreen
          - frameless
        default: window
      hide_title_bar:
        description: "Hide title bar (macOS only)"
        required: false
        type: boolean
        default: false
      new_window:
        description: "Allow sites to open new windows"
        required: false
        type: boolean
        default: false
      multi_arch:
        description: "Universal binary (macOS only)"
        required: false
        type: boolean
        default: false
      targets:
        description: "Package formats (comma-separated: deb,appimage,rpm,zst)"
        required: false
        default: "deb"
      safe_domain:
        description: "Domains kept inside the app (comma-separated)"
        required: false
        default: "sc.baifentu.net"
      installer_language:
        description: "Installer language (WiX). Use zh-CN for Chinese app names."
        required: false
        default: "zh-CN"

# Builds an app on demand for anyone who runs it; it writes nothing.
permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.platform }}
    if: inputs.platform == 'ubuntu-24.04'
    runs-on: ${{ inputs.platform }}
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        run: pnpm run cli:build

      - name: Setup mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Build App (Linux/macOS)
        if: runner.os != 'Windows'
        timeout-minutes: 25
        shell: bash
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_NAME: ${{ inputs.name }}
          INPUT_ICON: ${{ inputs.icon }}
          INPUT_WIDTH: ${{ inputs.width }}
          INPUT_HEIGHT: ${{ inputs.height }}
          INPUT_MIN_WIDTH: ${{ inputs.min_width }}
          INPUT_MIN_HEIGHT: ${{ inputs.min_height }}
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          INPUT_FULLSCREEN: ${{ inputs.fullscreen }}
          INPUT_HIDE_TITLE_BAR: ${{ inputs.hide_title_bar }}
          INPUT_NEW_WINDOW: ${{ inputs.new_window }}
          INPUT_MULTI_ARCH: ${{ inputs.multi_arch }}
          INPUT_TARGETS: ${{ inputs.targets }}
        run: |
          ARGS=("$INPUT_URL" "--name" "$INPUT_NAME")

          if [ -n "$INPUT_ICON" ]; then
            ARGS+=("--icon" "$INPUT_ICON")
          fi

          if [ -n "$INPUT_WIDTH" ]; then
            ARGS+=("--width" "$INPUT_WIDTH")
          fi

          if [ -n "$INPUT_HEIGHT" ]; then
            ARGS+=("--height" "$INPUT_HEIGHT")
          fi

          if [ -n "$INPUT_MIN_WIDTH" ]; then
            ARGS+=("--min-width" "$INPUT_MIN_WIDTH")
          fi

          if [ -n "$INPUT_MIN_HEIGHT" ]; then
            ARGS+=("--min-height" "$INPUT_MIN_HEIGHT")
          fi

          if [ -n "$INPUT_APP_VERSION" ]; then
            ARGS+=("--app-version" "$INPUT_APP_VERSION")
          fi

          if [ "$INPUT_FULLSCREEN" == "true" ]; then
            ARGS+=("--fullscreen")
          fi

          if [ "$INPUT_HIDE_TITLE_BAR" == "true" ]; then
            ARGS+=("--hide-title-bar")
          fi

          if [ "$INPUT_NEW_WINDOW" == "true" ]; then
            ARGS+=("--new-window")
          fi

          if [ "$INPUT_MULTI_ARCH" == "true" ]; then
            ARGS+=("--multi-arch")
          fi

          if [ -n "$INPUT_TARGETS" ] && [ "$RUNNER_OS" == "Linux" ]; then
            ARGS+=("--targets" "$INPUT_TARGETS")
          fi

          printf 'Running: node dist/cli.js'
          printf ' %q' "${ARGS[@]}"
          printf '\n'
          node dist/cli.js "${ARGS[@]}"

      - name: Upload DMG (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-macOS
          path: ${{ inputs.name }}.dmg
          retention-days: 3

      # The CLI lowercases and hyphenates Linux names, so match packages by extension.
      - name: Upload DEB (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-deb
          path: "*.deb"
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload AppImage (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-AppImage
          path: "*.AppImage"
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload RPM (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-rpm
          path: "*.rpm"
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload ZST (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-zst
          path: "*.pkg.tar.zst"
          retention-days: 3
          if-no-files-found: ignore

  windows:
    name: Windows (${{ matrix.arch }})
    if: inputs.platform == 'windows-latest'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        run: pnpm run cli:build

      # ARM64 is cross-compiled from the x64 runner, which needs this Rust target.
      - name: Add aarch64 Rust target
        if: matrix.arch == 'arm64'
        shell: bash
        run: rustup target add aarch64-pc-windows-msvc

      - name: Build App (Windows)
        timeout-minutes: 25
        shell: pwsh
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_NAME: ${{ inputs.name }}
          INPUT_ICON: ${{ inputs.icon }}
          INPUT_SAFE_DOMAIN: ${{ inputs.safe_domain }}
          INPUT_INSTALLER_LANGUAGE: ${{ inputs.installer_language }}
          INPUT_WIDTH: ${{ inputs.width }}
          INPUT_HEIGHT: ${{ inputs.height }}
          INPUT_MIN_WIDTH: ${{ inputs.min_width }}
          INPUT_MIN_HEIGHT: ${{ inputs.min_height }}
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          INPUT_FULLSCREEN: ${{ inputs.fullscreen }}
          INPUT_HIDE_TITLE_BAR: ${{ inputs.hide_title_bar }}
          INPUT_NEW_WINDOW: ${{ inputs.new_window }}
          INPUT_TARGETS: ${{ matrix.arch }}
          INPUT_MAXIMIZE: ${{ inputs.maximize }}
          INPUT_WINDOW_MODE: ${{ inputs.window_mode }}
        run: |
          $args = $env:INPUT_URL, "--name", $env:INPUT_NAME, "--targets", $env:INPUT_TARGETS

          # Empty environment variables are unset on Windows, so test for null too.
          if (-not [string]::IsNullOrEmpty($env:INPUT_ICON)) {
            $args += "--icon", $env:INPUT_ICON
          }

          if (-not [string]::IsNullOrEmpty($env:INPUT_SAFE_DOMAIN)) {
            $args += "--safe-domain", $env:INPUT_SAFE_DOMAIN
          }

          # WiX defaults to en-US (code page 1252), which cannot package a
          # Chinese product name; zh-CN switches it to code page 936.
          if (-not [string]::IsNullOrEmpty($env:INPUT_INSTALLER_LANGUAGE)) {
            $args += "--installer-language", $env:INPUT_INSTALLER_LANGUAGE
          }

          if (-not [string]::IsNullOrEmpty($env:INPUT_WIDTH)) {
            $args += "--width", $env:INPUT_WIDTH
          }

          if (-not [string]::IsNullOrEmpty($env:INPUT_HEIGHT)) {
            $args += "--height", $env:INPUT_HEIGHT
          }

          if (-not [string]::IsNullOrEmpty($env:INPUT_MIN_WIDTH)) {
            $args += "--min-width", $env:INPUT_MIN_WIDTH
          }

          if (-not [string]::IsNullOrEmpty($env:INPUT_MIN_HEIGHT)) {
            $args += "--min-height", $env:INPUT_MIN_HEIGHT
          }

          if (-not [string]::IsNullOrEmpty($env:INPUT_APP_VERSION)) {
            $args += "--app-version", $env:INPUT_APP_VERSION
          }

          if ($env:INPUT_FULLSCREEN -eq "true") {
            $args += "--fullscreen"
          }

          if ($env:INPUT_MAXIMIZE -eq "true") {
            $args += "--maximize"
          }

          # 网页「退出应用」按钮原本请求本地 127.0.0.1:19876，这里注入的脚本
          # 会把它接到 Tauri 的关窗上，所以任何窗口模式都能用网页按钮退出。
          $args += "--inject", "scripts/inject/quit-app.js"

          if ($env:INPUT_WINDOW_MODE -eq "fullscreen") {
            $args += "--fullscreen"
          }

          if ($env:INPUT_WINDOW_MODE -eq "frameless") {
            $args += "--hide-window-decorations"
          }

          if ($env:INPUT_HIDE_TITLE_BAR -eq "true") {
            $args += "--hide-title-bar"
          }

          if ($env:INPUT_NEW_WINDOW -eq "true") {
            $args += "--new-window"
          }

          Write-Host "Running: node dist/cli.js $($args -join ' ')"
          node dist/cli.js $args

          $buildExit = $LASTEXITCODE

          # The CLI normally copies the installer to the repo root as <name>.msi,
          # then we stamp the arch so the two matrix runs don't collide. On
          # Windows arm64 it instead looks for "..._aarch64_..." while Tauri names
          # the file "..._arm64_..." (upstream naming bug), so recover the MSI
          # from the bundle directory when the root copy is missing.
          $msi = "$($env:INPUT_NAME).msi"
          $stamped = "$($env:INPUT_NAME)-$($env:INPUT_TARGETS).msi"
          if (-not (Test-Path $msi)) {
            $found = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter *.msi -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($found) {
              Copy-Item -LiteralPath $found.FullName -Destination $msi
              Write-Host "Recovered installer from $($found.FullName)"
            }
          }

          if (Test-Path $msi) {
            Move-Item -Force $msi $stamped
            Write-Host "Produced $stamped"
          } else {
            Write-Error "No MSI was produced"
            Get-ChildItem -Path . -Recurse -Filter *.msi | Select-Object -ExpandProperty FullName | Write-Host
            exit 1
          }

          if ($buildExit -ne 0) {
            Write-Warning "pake exited with code $buildExit, but the MSI was recovered"
          }

          git checkout -- src-tauri/Cargo.lock

      - name: Upload MSI (Windows)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Windows-${{ matrix.arch }}
          path: ${{ inputs.name }}-${{ matrix.arch }}.msi
          retention-days: 3

  macos:
    name: macOS (${{ matrix.arch }})
    if: inputs.platform == 'macos-latest'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        run: pnpm run cli:build

      - name: Build App (macOS)
        timeout-minutes: 40
        shell: bash
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_NAME: ${{ inputs.name }}
          INPUT_ICON: ${{ inputs.icon }}
          INPUT_SAFE_DOMAIN: ${{ inputs.safe_domain }}
          INPUT_WIDTH: ${{ inputs.width }}
          INPUT_HEIGHT: ${{ inputs.height }}
          INPUT_MIN_WIDTH: ${{ inputs.min_width }}
          INPUT_MIN_HEIGHT: ${{ inputs.min_height }}
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          INPUT_FULLSCREEN: ${{ inputs.fullscreen }}
          INPUT_HIDE_TITLE_BAR: ${{ inputs.hide_title_bar }}
          INPUT_NEW_WINDOW: ${{ inputs.new_window }}
          INPUT_WINDOW_MODE: ${{ inputs.window_mode }}
          INPUT_TARGETS: ${{ matrix.arch }}
        run: |
          ARGS=("$INPUT_URL" "--name" "$INPUT_NAME" "--targets" "$INPUT_TARGETS")

          # macOS 只认 .icns；Pake 会用 sharp 把 png 转成 icns，但 sharp 读不了 .ico，
          # 传 .ico 会静默退化成默认图标。所以把 .ico 换成同名 .png。
          ICON="$INPUT_ICON"
          case "$ICON" in
            *.ico) ICON="${ICON%.ico}.png" ;;
          esac
          if [ -n "$ICON" ]; then ARGS+=("--icon" "$ICON"); fi
          if [ -n "$INPUT_SAFE_DOMAIN" ]; then ARGS+=("--safe-domain" "$INPUT_SAFE_DOMAIN"); fi
          if [ -n "$INPUT_WIDTH" ]; then ARGS+=("--width" "$INPUT_WIDTH"); fi
          if [ -n "$INPUT_HEIGHT" ]; then ARGS+=("--height" "$INPUT_HEIGHT"); fi
          if [ -n "$INPUT_MIN_WIDTH" ]; then ARGS+=("--min-width" "$INPUT_MIN_WIDTH"); fi
          if [ -n "$INPUT_MIN_HEIGHT" ]; then ARGS+=("--min-height" "$INPUT_MIN_HEIGHT"); fi
          if [ -n "$INPUT_APP_VERSION" ]; then ARGS+=("--app-version" "$INPUT_APP_VERSION"); fi
          if [ "$INPUT_FULLSCREEN" == "true" ]; then ARGS+=("--fullscreen"); fi
          if [ "$INPUT_HIDE_TITLE_BAR" == "true" ]; then ARGS+=("--hide-title-bar"); fi
          if [ "$INPUT_NEW_WINDOW" == "true" ]; then ARGS+=("--new-window"); fi
          if [ "$INPUT_WINDOW_MODE" == "frameless" ]; then ARGS+=("--hide-window-decorations"); fi
          if [ "$INPUT_WINDOW_MODE" == "fullscreen" ]; then ARGS+=("--fullscreen"); fi

          # The page's 退出应用 button closes the window; macOS defaults to hiding
          # the app instead of quitting, so disable that.
          ARGS+=("--inject" "scripts/inject/quit-app.js" "--hide-on-close" "false")

          printf 'Running: node dist/cli.js'
          printf ' %q' "${ARGS[@]}"
          echo
          node dist/cli.js "${ARGS[@]}"

          git checkout -- src-tauri/Cargo.lock

          DMG="$INPUT_NAME.dmg"
          STAMPED="$INPUT_NAME-$INPUT_TARGETS.dmg"
          if [ -f "$DMG" ]; then
            mv -f "$DMG" "$STAMPED"
          else
            FOUND=$(find src-tauri/target -name '*.dmg' -type f | head -1)
            if [ -n "$FOUND" ]; then cp -f "$FOUND" "$STAMPED"; fi
          fi
          if [ ! -f "$STAMPED" ]; then echo "::error::No DMG produced"; exit 1; fi
          ls -lh "$STAMPED"

      - name: Upload DMG (macOS)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-macOS-${{ matrix.arch }}
          path: ${{ inputs.name }}-${{ matrix.arch }}.dmg
          retention-days: 3
