name: 打包百分兔（正式+测试 · Windows+macOS+Linux）

# 一次运行产出全部安装包：
#   正式 Windows x64/arm64、正式 macOS arm64/x64、正式 Linux x64 AppImage
#   测试 Windows x64/arm64、测试 macOS arm64/x64、测试 Linux x64 AppImage
# 最后一个 job 会把所有产物合并成一个 zip，只需下载一次。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_version:
        description: "版本号（必须比上一次大，例如 1.1.4）"
        required: true
      window_mode:
        description: "窗口模式：fullscreen（全屏无按钮）/ window（普通窗口）/ frameless（无标题栏）"
        required: false
        type: choice
        options:
          - fullscreen
          - window
          - frameless
        default: fullscreen
      platform:
        description: "要打哪些平台"
        required: false
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
        default: all
      environment:
        description: "要打哪些环境"
        required: false
        type: choice
        options:
          - all
          - prod
          - test
        default: all
      merge_artifact:
        description: "把全部产物合并成一个 zip"
        required: false
        type: boolean
        default: true
      publish_release:
        description: "构建完成后自动发布到 GitHub Release（tag: v<版本>）"
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.26.2"
  APP_VERSION: ${{ github.event.inputs.app_version || format('1.1.{0}', github.run_number) }}
  WINDOW_MODE: ${{ github.event.inputs.window_mode || 'fullscreen' }}

# 只读取仓库内容；产物通过 artifact 上传。
permissions:
  contents: read

jobs:
  prepare:
    name: 生成构建矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Build matrix
        id: matrix
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
          ENVIRONMENT: ${{ inputs.environment || 'all' }}
        run: |
          node -e '
            const platform = process.env.PLATFORM;
            const environment = process.env.ENVIRONMENT;

            const envs = [];
            if (environment === "all" || environment === "prod") {
              envs.push({ key: "prod", name: "百分兔", url: "https://sc.baifentu.net/web_app/#/", domain: "sc.baifentu.net", bundle: true });
            }
            if (environment === "all" || environment === "test") {
              envs.push({ key: "test", name: "百分兔测试", url: "https://tiku.baifentu.net/web_app/#/", domain: "tiku.baifentu.net", bundle: false });
            }

            const osList = [];
            if (platform === "all" || platform === "windows") osList.push({
              os: "windows-latest",
              platform: "windows",
              arches: [{ arch: "x64", target: "x64" }, { arch: "arm64", target: "arm64" }],
            });
            if (platform === "all" || platform === "macos") osList.push({
              os: "macos-latest",
              platform: "macos",
              arches: [{ arch: "arm64", target: "arm64" }, { arch: "x64", target: "x64" }],
            });
            if (platform === "all" || platform === "linux") osList.push({
              os: "ubuntu-24.04",
              platform: "linux",
              arches: [{ arch: "x64", target: "appimage" }],
            });

            const include = [];
            for (const env of envs) for (const item of osList) for (const entry of item.arches) {
              include.push({
                ...env,
                os: item.os,
                platform: item.platform,
                arch: entry.arch,
                target: entry.target,
                label: env.key + "-" + item.platform + "-" + entry.arch,
                file: env.key === "prod" ? "baifentu" : "baifentu-test",
              });
            }

            console.log(include.length + " jobs");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "value=" + JSON.stringify({ include }) + "\n");
          '

  build:
    name: ${{ matrix.name }} · ${{ matrix.platform == 'windows' && 'Windows' || matrix.platform == 'macos' && 'macOS' || 'Linux' }} ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        run: pnpm run cli:build

      # Windows arm64 由 x64 runner 交叉编译
      - name: Add aarch64 Rust target
        if: matrix.os == 'windows-latest' && matrix.arch == 'arm64'
        shell: bash
        run: rustup target add aarch64-pc-windows-msvc

      # 正式版：Windows 内嵌离线 WebView2；macOS/Linux 塞占位资源撑体积
      - name: Configure bundle size
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest)
              node scripts/ci/configure-bundle.mjs windows "${{ matrix.bundle }}"
              ;;
            macos-latest|ubuntu-24.04)
              if [ "${{ matrix.os }}" == "ubuntu-24.04" ]; then
                PLATFORM=linux
              else
                PLATFORM=macos
              fi
              node scripts/ci/configure-bundle.mjs "$PLATFORM" "${{ matrix.bundle }}"
              if [ "${{ matrix.bundle }}" == "true" ]; then
                curl -sSL -o src-tauri/webview2-runtime.cab \
                  "https://api.nuget.org/v3-flatcontainer/webview2.runtime.x64/156.0.4314.42/webview2.runtime.x64.156.0.4314.42.nupkg"
                ls -lh src-tauri/webview2-runtime.cab
              fi
              ;;
          esac

      - name: Build app (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          INPUT_URL: ${{ matrix.url }}
          INPUT_NAME: ${{ matrix.name }}
          INPUT_FILE: ${{ matrix.file }}
          INPUT_SAFE_DOMAIN: ${{ matrix.domain }}
          INPUT_APP_VERSION: ${{ env.APP_VERSION }}
          INPUT_WINDOW_MODE: ${{ env.WINDOW_MODE }}
          INPUT_ARCH: ${{ matrix.arch }}
        run: |
          $args = $env:INPUT_URL, "--name", $env:INPUT_NAME, "--targets", $env:INPUT_ARCH
          $args += "--icon", "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/assets/bft-icon.ico"
          $args += "--safe-domain", $env:INPUT_SAFE_DOMAIN
          $args += "--width", "1200", "--height", "780"
          $args += "--installer-language", "zh-CN"
          $args += "--app-version", $env:INPUT_APP_VERSION
          $args += "--inject", "scripts/inject/quit-app.js,scripts/inject/disable-context-menu.js"

          if ($env:INPUT_WINDOW_MODE -eq "fullscreen") { $args += "--fullscreen" }
          if ($env:INPUT_WINDOW_MODE -eq "frameless") { $args += "--hide-window-decorations" }

          Write-Host "Running: node dist/cli.js $($args -join ' ')"
          node dist/cli.js $args
          $buildExit = $LASTEXITCODE

          $msi = "$($env:INPUT_NAME).msi"
          $stamped = "$($env:INPUT_FILE)-$($env:INPUT_ARCH)-v$($env:INPUT_APP_VERSION).msi"
          if (-not (Test-Path $msi)) {
            $found = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter *.msi -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($found) { Copy-Item -LiteralPath $found.FullName -Destination $msi -Force }
          }
          if (-not (Test-Path $msi)) {
            Write-Error "没有生成 msi"
            Get-ChildItem -Path . -Recurse -Filter *.msi | Select-Object -ExpandProperty FullName | Write-Host
            exit 1
          }
          Move-Item -Force $msi $stamped
          Write-Host "Produced $stamped"
          if ($buildExit -ne 0) { Write-Warning "pake 退出码 $buildExit，但已取回安装包" }

          git checkout -- src-tauri/Cargo.lock

      - name: Build app (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          INPUT_URL: ${{ matrix.url }}
          INPUT_NAME: ${{ matrix.name }}
          INPUT_FILE: ${{ matrix.file }}
          INPUT_SAFE_DOMAIN: ${{ matrix.domain }}
          INPUT_APP_VERSION: ${{ env.APP_VERSION }}
          INPUT_WINDOW_MODE: ${{ env.WINDOW_MODE }}
          INPUT_ARCH: ${{ matrix.arch }}
        run: |
          ARGS=("$INPUT_URL" "--name" "$INPUT_NAME" "--targets" "$INPUT_ARCH")
          ARGS+=("--icon" "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/assets/bft-icon.png")
          ARGS+=("--safe-domain" "$INPUT_SAFE_DOMAIN")
          ARGS+=("--width" "1200" "--height" "780")
          ARGS+=("--app-version" "$INPUT_APP_VERSION")
          ARGS+=("--inject" "scripts/inject/quit-app.js,scripts/inject/disable-context-menu.js")
          ARGS+=("--hide-on-close" "false")

          if [ "$INPUT_WINDOW_MODE" == "fullscreen" ]; then ARGS+=("--fullscreen"); fi
          if [ "$INPUT_WINDOW_MODE" == "frameless" ]; then ARGS+=("--hide-window-decorations"); fi

          printf 'Running: node dist/cli.js'
          printf ' %q' "${ARGS[@]}"
          echo
          node dist/cli.js "${ARGS[@]}"
          build_exit=$?

          DMG="$INPUT_NAME.dmg"
          STAMPED="$INPUT_FILE-$INPUT_ARCH-v$INPUT_APP_VERSION.dmg"
          if [ ! -f "$DMG" ]; then
            FOUND=$(find src-tauri/target -name '*.dmg' -type f | head -1)
            if [ -n "$FOUND" ]; then cp -f "$FOUND" "$DMG"; fi
          fi
          if [ ! -f "$DMG" ]; then echo "::error::没有生成 dmg"; exit 1; fi
          mv -f "$DMG" "$STAMPED"
          ls -lh "$STAMPED"
          if [ "$build_exit" -ne 0 ]; then echo "::warning::pake 退出码 $build_exit，但已取回安装包"; fi

          git checkout -- src-tauri/Cargo.lock

      - name: Install GStreamer plugins (Linux)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-gl \
            gstreamer1.0-alsa \
            gstreamer1.0-pulseaudio

      - name: Build app (Linux)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          INPUT_URL: ${{ matrix.url }}
          INPUT_NAME: ${{ matrix.name }}
          INPUT_FILE: ${{ matrix.file }}
          INPUT_SAFE_DOMAIN: ${{ matrix.domain }}
          INPUT_APP_VERSION: ${{ env.APP_VERSION }}
          INPUT_WINDOW_MODE: ${{ env.WINDOW_MODE }}
          INPUT_ARCH: ${{ matrix.arch }}
          INPUT_TARGET: ${{ matrix.target }}
        run: |
          ARGS=("$INPUT_URL" "--name" "$INPUT_NAME" "--targets" "$INPUT_TARGET")
          ARGS+=("--icon" "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/assets/bft-icon.png")
          ARGS+=("--safe-domain" "$INPUT_SAFE_DOMAIN")
          ARGS+=("--width" "1200" "--height" "780")
          ARGS+=("--app-version" "$INPUT_APP_VERSION")
          ARGS+=("--inject" "scripts/inject/quit-app.js,scripts/inject/disable-context-menu.js")
          ARGS+=("--hide-on-close" "false")

          if [ "$INPUT_WINDOW_MODE" == "fullscreen" ]; then ARGS+=("--fullscreen"); fi
          if [ "$INPUT_WINDOW_MODE" == "frameless" ]; then ARGS+=("--hide-window-decorations"); fi

          printf 'Running: node dist/cli.js'
          printf ' %q' "${ARGS[@]}"
          echo
          node dist/cli.js "${ARGS[@]}"

          APPIMAGE="$INPUT_NAME.AppImage"
          STAMPED="$INPUT_FILE-linux-$INPUT_ARCH-v$INPUT_APP_VERSION.AppImage"
          if [ ! -f "$APPIMAGE" ]; then
            FOUND=$(find src-tauri/target -name '*.AppImage' -type f | head -1)
            if [ -n "$FOUND" ]; then cp -f "$FOUND" "$APPIMAGE"; fi
          fi
          if [ ! -f "$APPIMAGE" ]; then
            echo "::error::没有生成 AppImage"
            find . -name '*.AppImage' -type f
            exit 1
          fi
          mv -f "$APPIMAGE" "$STAMPED"
          ls -lh "$STAMPED"

          git checkout -- src-tauri/Cargo.lock

      # AppImage 不会自带 WebKitGTK：缺库时给出可读提示，而不是白屏或双击无反应。
      - name: Harden AppImage (dependency check)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          INPUT_FILE: ${{ matrix.file }}
          INPUT_ARCH: ${{ matrix.arch }}
          INPUT_APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          set -euo pipefail

          APPIMAGE="$INPUT_FILE-linux-$INPUT_ARCH-v$INPUT_APP_VERSION.AppImage"
          if [ ! -f "$APPIMAGE" ]; then
            echo "::error::AppImage not found: $APPIMAGE"
            exit 1
          fi
          chmod +x "$APPIMAGE"

          if ! command -v mksquashfs >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y squashfs-tools
          fi

          TOOL_DIR="$(mktemp -d)"
          trap 'rm -rf "$TOOL_DIR"' EXIT

          # 固定版本，避免 continuous 标签漂移导致产物不可复现。
          curl -sSL -o "$TOOL_DIR/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          chmod +x "$TOOL_DIR/appimagetool"

          APPIMAGE_ABS="$(realpath "$APPIMAGE")"
          mkdir -p "$TOOL_DIR/extract"
          (cd "$TOOL_DIR/extract" && "$APPIMAGE_ABS" --appimage-extract >/dev/null)

          APPDIR="$TOOL_DIR/extract/squashfs-root"

          # 不打包 Wayland 客户端库，避免包内旧版本覆盖宿主图形栈（WSLg/新版发行版易触发 EGL 初始化失败）。
          find "$APPDIR/usr/lib" -maxdepth 2 -name 'libwayland-*.so*' -delete

          # 内置 Source Han Sans SC，保证目标系统缺少中文字体时也能正常显示。
          FONT_DIR="$APPDIR/usr/share/fonts/opentype/source-han-sans"
          mkdir -p "$FONT_DIR"
          curl -sSL -o "$FONT_DIR/SourceHanSansSC-Regular.otf" \
            "https://github.com/adobe-fonts/source-han-sans/raw/release/OTF/SimplifiedChinese/SourceHanSansSC-Regular.otf"
          test -s "$FONT_DIR/SourceHanSansSC-Regular.otf"

          mkdir -p "$APPDIR/etc/fonts/conf.d"
          cat > "$APPDIR/etc/fonts/fonts.conf" <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
            <include ignore_missing="yes">conf.d</include>
          </fontconfig>
          EOF
          cat > "$APPDIR/etc/fonts/conf.d/99-source-han-sans.conf" <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias>
              <family>sans-serif</family>
              <prefer><family>Source Han Sans SC</family></prefer>
            </alias>
            <alias>
              <family>system-ui</family>
              <prefer><family>Source Han Sans SC</family></prefer>
            </alias>
            <match target="pattern">
              <test name="lang" compare="contains"><string>zh</string></test>
              <edit name="family" mode="prepend" binding="strong"><string>Source Han Sans SC</string></edit>
            </match>
          </fontconfig>
          EOF

          if command -v fc-match >/dev/null 2>&1; then
            MATCHED="$(FONTCONFIG_PATH="$APPDIR/etc/fonts" XDG_DATA_DIRS="$APPDIR/usr/share" fc-match sans-serif)"
            echo "fc-match: $MATCHED"
            case "$MATCHED" in
              *"Source Han Sans SC"*) ;;
              *)
                echo "::error::Source Han Sans SC is not the preferred sans-serif font"
                exit 1
                ;;
            esac
          fi

          mv "$APPDIR/AppRun" "$APPDIR/AppRun.real"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export FONTCONFIG_PATH="$HERE/etc/fonts"
          export XDG_DATA_DIRS="$HERE/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
          BIN="$(find "$HERE/usr/bin" -maxdepth 1 -type f -print -quit 2>/dev/null || true)"

          MISSING=""
          if [ -n "$BIN" ]; then
            MISSING="$(LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ldd "$BIN" 2>/dev/null | grep 'not found' || true)"
          fi

          if [ -n "$MISSING" ]; then
            MSG="应用缺少运行依赖，无法启动。
          Missing runtime dependencies:

          $MISSING

          请先安装 WebKitGTK 4.1:
            Ubuntu/Debian: sudo apt install libwebkit2gtk-4.1-0
            Fedora:        sudo dnf install webkit2gtk4.1
            Arch:          sudo pacman -S webkit2gtk-4.1"

            if command -v zenity >/dev/null 2>&1; then
              zenity --error --no-wrap --text="$MSG" 2>/dev/null || true
            elif command -v kdialog >/dev/null 2>&1; then
              kdialog --error "$MSG" 2>/dev/null || true
            elif command -v xmessage >/dev/null 2>&1; then
              xmessage -center "$MSG" 2>/dev/null || true
            else
              printf '%s\n' "$MSG" >&2
            fi
            exit 1
          fi

          exec "$HERE/AppRun.real" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          ARCH=x86_64 "$TOOL_DIR/appimagetool" --appimage-extract-and-run \
            "$APPDIR" "$TOOL_DIR/repacked.AppImage" >/dev/null
          mv -f "$TOOL_DIR/repacked.AppImage" "$APPIMAGE_ABS"
          chmod +x "$APPIMAGE_ABS"
          ls -lh "$APPIMAGE"

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.label }}
          path: |
            ${{ matrix.file }}-${{ matrix.arch }}-v${{ env.APP_VERSION }}.msi
            ${{ matrix.file }}-${{ matrix.arch }}-v${{ env.APP_VERSION }}.dmg
            ${{ matrix.file }}-linux-${{ matrix.arch }}-v${{ env.APP_VERSION }}.AppImage
          retention-days: 3
          if-no-files-found: error

  merge:
    name: 合并全部安装包
    needs: build
    if: ${{ inputs.merge_artifact != false || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: installers
          merge-multiple: true

      - name: Show collected files
        run: ls -lh installers

      - name: Verify artifacts
        run: |
          set -e
          count=$(find installers -type f -size +0 | wc -l)
          echo "collected $count non-empty artifacts"
          test "$count" -gt 0

      - uses: actions/upload-artifact@v6
        with:
          name: baifentu-installers-v${{ env.APP_VERSION }}
          path: installers/*
          retention-days: 3

  release:
    name: 发布到 Release
    needs: build
    if: ${{ inputs.publish_release != false || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: installers
          merge-multiple: true

      - name: Show files
        run: ls -lh installers

      - name: Verify artifacts
        run: |
          set -e
          count=$(find installers -type f -size +0 | wc -l)
          echo "collected $count non-empty artifacts"
          test "$count" -gt 0

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create "v${{ env.APP_VERSION }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "百分兔 v${{ env.APP_VERSION }}" \
            --notes "自动构建产物（窗口模式：${{ env.WINDOW_MODE }}）
            - 正式：Windows x64 / arm64、macOS arm64 / x64、Linux x64 AppImage
            - 测试：Windows x64 / arm64、macOS arm64 / x64、Linux x64 AppImage"
          for f in installers/*; do
            for attempt in 1 2 3; do
              if gh release upload "v${{ env.APP_VERSION }}" "$f" --repo "$GITHUB_REPOSITORY" --clobber; then
                break
              fi
              echo "upload failed for $f (attempt $attempt), retrying in 15s"
              sleep 15
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          done
